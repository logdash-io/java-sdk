name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A release in progress must finish; a newer merge waits and releases after it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash # with pipefail, so a failing command in a pipe fails the step

env:
  JAVA_VERSION: '17'
  MAVEN_OPTS: >
    -Xmx2048m
    -XX:+UseG1GC
    -Daether.connector.http.connectionMaxTtl=25
    -Dmaven.artifact.threads=8

jobs:
  validate:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Validate Project
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 2
          retry_wait_seconds: 30
          command: mvn clean validate compile -B --no-transfer-progress -DskipTests

      # The quality profile's execution, which fails on a warning; a bare dependency:analyze only warns.
      - name: Verify Dependencies
        run: |
          mvn test-compile dependency:analyze-only@analyze-dependencies -B --no-transfer-progress -Pquality
          mvn dependency:tree -B --no-transfer-progress | tee dependency-tree.txt

      - name: Code Style Check (Spotless)
        run: mvn spotless:check -B --no-transfer-progress

      - name: Security Analysis (SpotBugs)
        run: mvn spotbugs:check -B --no-transfer-progress

      - name: Upload Dependency Tree
        uses: actions/upload-artifact@v7
        with:
          name: dependency-analysis
          path: dependency-tree.txt
          retention-days: 7

  test:
    name: Test Suite (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      checks: write # the test report
    strategy:
      fail-fast: false
      matrix:
        java: [ 17, 21, 22 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      - name: Run Tests & Coverage Check
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 30
          command: mvn clean verify -B --no-transfer-progress -Djava.version=${{ matrix.java }}

      - name: Upload coverage reports to Codecov
        if: matrix.java == 17
        uses: codecov/codecov-action@v7
        with:
          files: target/site/jacoco-merged/jacoco.xml,target/site/jacoco/jacoco.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

      - name: Upload Test Results
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() && matrix.java == 17 }}
        with:
          name: Test Results (Java ${{ matrix.java }})
          path: target/surefire-reports/TEST-*.xml,target/failsafe-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: false # the test step has failed the job already

  test-scripts:
    name: Test Suite (release scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run Tests
        run: node --test 'scripts/*.test.ts'

  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 15
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'security-scan')
    permissions:
      contents: read
      security-events: write # the SARIF upload

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      # Online, Trivy fetches the dependencies' poms from Maven Central, which rate-limits it (429) and
      # fails the scan. Maven puts them in ~/.m2 instead, where Trivy's offline scan finds them.
      - name: Resolve Dependencies for Security Scan
        run: for pom in pom.xml examples/*/pom.xml; do mvn dependency:tree -B --no-transfer-progress -q -f "$pom"; done

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        env:
          TRIVY_OFFLINE_SCAN: true

      - name: Upload SARIF
        if: hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'

  # The version the merged commits call for; empty when none of them is a feat, fix, perf, or breaking change.
  version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      next: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the tags and commits since the last release
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: next
        run: |
          next=$(node scripts/version.ts) # on its own line, so a crash fails the step instead of releasing nothing
          echo "version=$next" >> "$GITHUB_OUTPUT"

  # Publishes the merge to Maven Central, then tags it with a GitHub release.
  release:
    needs: [ validate, test, test-scripts, security-scan, version ]
    if: needs.version.outputs.next != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # the release and its tag
    env:
      V: ${{ needs.version.outputs.next }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username-env-var: CENTRAL_TOKEN_USERNAME
          server-password-env-var: CENTRAL_TOKEN_PASSWORD
      # Imports the signing key and gives gpg-agent its passphrase.
      - uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - run: mvn -B --no-transfer-progress org.codehaus.mojo:versions-maven-plugin:2.23.0:set -DnewVersion="$V" -DgenerateBackupPoms=false
      # Signs, uploads to the Central Portal, and waits until it is published.
      - run: mvn clean deploy -B --no-transfer-progress -Pmaven-central-release -DskipTests -Dgpg.keyname="$GPG_KEY_ID"
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
      # Last, since it creates the tag that marks the version released.
      - run: gh release create "v$V" --generate-notes --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ github.token }}

  # Installs the version just released from Maven Central and checks that its logs and metrics arrive.
  check-deployed-package:
    needs: [ version, release ]
    uses: ./.github/workflows/check-deployed-package.yml
    with:
      version: ${{ needs.version.outputs.next }}
    secrets:
      LOGDASH_API_KEY: ${{ secrets.LOGDASH_API_KEY }}
      LOGDASH_PERSONAL_API_KEY: ${{ secrets.LOGDASH_PERSONAL_API_KEY }}
