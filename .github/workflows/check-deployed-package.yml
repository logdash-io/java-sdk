name: Check deployed package

# CI calls it after each release; run it by hand to check any version from any branch.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
    secrets: # run.sh fails with a clear message when one is missing
      LOGDASH_API_KEY:
        required: false
      LOGDASH_PERSONAL_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: Version to check; empty checks the latest release
        type: string

permissions:
  contents: read

jobs:
  check-deployed-package:
    name: Check deployed package
    runs-on: ubuntu-latest
    timeout-minutes: 75 # up to an hour waiting for Maven Central
    steps:
      - uses: actions/checkout@v7
      - run: ./check-deployed-package/run.sh
        env:
          LOGDASH_VERSION: ${{ inputs.version }}
          LOGDASH_API_KEY: ${{ secrets.LOGDASH_API_KEY }}
          LOGDASH_PERSONAL_API_KEY: ${{ secrets.LOGDASH_PERSONAL_API_KEY }}
